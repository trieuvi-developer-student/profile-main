<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dori — Personal Profile</title>
    <meta name="description" content="Không gian cá nhân cho nội dung, tiện ích và kết nối cộng đồng.">

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <link rel="stylesheet" href="assets/css/animation.css">
    <link rel="stylesheet" href="assets/css/components/navbar.css">
    <link rel="stylesheet" href="assets/css/components/drawer.css">
    <link rel="stylesheet" href="assets/css/components/hero.css">
    <link rel="stylesheet" href="assets/css/components/tabbar.css">
    <link rel="stylesheet" href="assets/css/components/terminal.css">
    <link rel="stylesheet" href="assets/css/components/social-card.css">
    <link rel="stylesheet" href="assets/css/components/payment-card.css">
    <link rel="stylesheet" href="assets/css/components/misc-cards.css">
    <link rel="stylesheet" href="assets/css/components/press-card.css">
    <link rel="stylesheet" href="assets/css/components/music-player.css">
</head>
<body>

    <!-- Navbar được render.js chèn nội dung vào -->
    <header class="navbar" id="app-navbar"></header>

    <main class="page">
        <div class="container">

            <section class="hero animate-fade-in" id="app-hero"></section>
            <div class="section" id="app-press" style="margin-top: 16px;"></div>
            <nav class="tabbar" id="app-tabbar" aria-label="Điều hướng nội dung"></nav>

            <!-- ===== Trang: Cá nhân ===== -->
            <div class="tab-page is-active" data-tab-page="personal">
                <section class="section" id="app-terminal"></section>
                <section class="section" id="app-social"></section>
            </div>

            <!-- ===== Trang: Thanh toán ===== -->
            <div class="tab-page" data-tab-page="payment">
                <section class="section" id="app-payment"></section>
            </div>

            <!-- ===== Trang: Tiện ích ===== -->
            <div class="tab-page" data-tab-page="utilities">
                <section class="section" id="app-utilities"></section>
            </div>

            <!-- ===== Trang: Bài đăng ===== -->
            <div class="tab-page" data-tab-page="posts">
                <section class="section" id="app-posts"></section>
            </div>

            <footer class="footer" id="app-footer"></footer>
        </div>
    </main>

    <aside id="app-music-workspace" class="music-workspace" aria-label="Music player"></aside>

    <!-- Overlay tĩnh, nội dung .drawer bên trong do render.js chèn vào -->
    <div class="drawer-overlay" data-drawer-overlay>
        <div id="app-drawer"></div>
    </div>

    <script type="module" src="assets/js/render.js"></script>
    <script src="assets/js/dropdown.js" defer></script>
    <script src="assets/js/tabbar.js" defer></script>
    <script src="assets/js/copy-clipboard.js" defer></script>
    <script src="assets/js/main.js" defer></script>
    <script type="module" src="assets/js/music-player.js"></script>
</body>
</html>
